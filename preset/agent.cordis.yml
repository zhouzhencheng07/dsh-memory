# The `dream` agent preset: the minimal composition for dsh-memory Dream
# sessions.
#
# Every Dream pass runs as ONE background agent conversation bound to the
# dream workspace (cwd = $DSH_HOME/dsh-memory/dream). Agents created through
# ctx.agents.create() mount NO preset by default, and in the web composition
# every model-facing file tool (read/write/edit/glob/grep) lives BEHIND agent
# presets — a preset-less session resolves only the empty global tool layer
# (it saw only memory_search, could not read notes or write digest files, and
# every digest it reported was missing on disk). This preset gives the Dream
# session the file tools plus the instructions loader that pulls the
# consolidation rulebook (the workspace AGENTS.md, user-editable).
#
# Deliberately minimal on purpose: NO shell, background jobs, skills, goals,
# plan mode, compaction, delegation or workflow rows. The session only reads
# notes and writes digest files, and its last message must be a strict JSON
# report — extra prompt sections would only add noise (plan-mode, compaction
# and code-mode sections would fight the strict-JSON contract).
#
# The plugin copies this file (plus preset.yml and the AGENTS.md template)
# into $DSH_HOME/.agent-presets/dream/ on startup when absent and NEVER
# overwrites an existing copy: edit freely, the plugin respects your version.
# Rows here register into host registries (tools / system prompt) and provide
# no service of their own, so — exactly like the `standard` preset's rows —
# they need no `isolate` realm.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是 dsh-memory 的 Dream 记忆巩固引擎。你在 Dream 工作区（{{cwd}}）里把每日笔记
      提炼进长期精炼 digest 库。先读本工作区根目录的 AGENTS.md（巩固规则全集），再按任务书
      给出的待处理笔记清单执行：直接浏览笔记与已有 digest，用 write/edit 新建或更新 digest。
      工作完成后，最后一条消息必须是严格 JSON 报告——不要任何解释文字、不要 markdown 围栏。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false